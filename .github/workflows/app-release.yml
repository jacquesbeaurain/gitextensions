name: App release (x64, arm64)

on:
  push:
    branches:
      - 'release'
      - 'release/*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tagcheck:
    name: Check HEAD has a version tag
    runs-on: ubuntu-latest
    # Releases are only produced from the upstream repository, never from forks.
    if: ${{ github.repository_owner == 'gitextensions' }}
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || git tag --points-at HEAD | grep -qE '^v'; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.os }}
    needs: tagcheck
    # Releases are only produced from the upstream repository, never from forks.
    if: ${{ needs.tagcheck.outputs.proceed == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, windows-11-arm ]
    uses: ./.github/workflows/_app-build-core.yml
    with:
      os: ${{ matrix.os }}
      release: true

  macos-dmg:
    name: macOS Apple Silicon disk image
    needs: build
    # Releases are only produced from the upstream repository, never from forks.
    if: ${{ github.repository_owner == 'gitextensions' }}
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'

      - name: Publish and package
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          publish="$RUNNER_TEMP/publish-osx-arm64"
          dotnet publish src/app/GitExtensions.Avalonia/GitExtensions.Avalonia.csproj \
            -c Release -p:BuildAvalonia=true -p:ContinuousIntegrationBuild=true \
            -r osx-arm64 --self-contained true -m:1 --output "$publish"
          mkdir -p dist
          # Ad-hoc signed and not notarized; set CODESIGN_IDENTITY here once a Developer ID is available.
          bash eng/avalonia/package-macos-app.sh \
            "$publish" "dist/GitExtensions-$VERSION-macOS-arm64.dmg" "$VERSION" "$VERSION"

      - name: Upload disk image
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: GE-v${{ needs.build.outputs.version }}-macos-arm64-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  trigger-signing:
    name: Upload dist files to SignPath
    runs-on: ubuntu-latest
    needs: build
    # Releases are only produced from the upstream repository, never from forks.
    if: ${{ success() && github.repository_owner == 'gitextensions' && vars.ARTIFACT_SIGNING_ENABLED == 'true' }}
    permissions:
      actions: read # required so GITHUB_TOKEN can download artifacts for the SignPath connector
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # Only the Windows distribution files go to SignPath; the macOS disk image is not signed there.
          pattern: GE-v*-dist
          path: ./artifacts
          merge-multiple: true

      - name: Display artifacts
        run: ls -R ./artifacts

      - name: Upload unsigned artifacts
        id:   upload-unsigned-artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: GE-v${{ needs.build.outputs.version }}-unsigned
          path: ./artifacts/*
          retention-days: 7

      - name: Submit signing request to SignPath
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The connector authenticates to SignPath via the API token (Authorization header),
          # and uses gitHubToken to download the artifact directly from GitHub Actions.
          $body = @{
            artifactId                       = "${{ steps.upload-unsigned-artifacts.outputs.artifact-id }}"
            gitHubWorkflowRunId              = "${{ github.run_id }}"
            gitHubRepository                 = "${{ github.repository }}"
            gitHubToken                      = $env:GITHUB_TOKEN
            signPathProjectSlug              = "GitExtensions_combined"
            signPathSigningPolicySlug        = "release-2020"
          } | ConvertTo-Json

          $response = Invoke-RestMethod `
            -Uri "https://githubactions.connectors.signpath.io/7c19b2cf-90f7-4d15-9b12-1b615f7c18c4/SigningRequests?api-version=1.0" `
            -Method POST `
            -Headers @{
              "Content-Type"  = "application/json"
              "Authorization" = "Bearer $env:SIGNPATH_API_TOKEN"
            } `
            -Body $body
          Write-Host "Signing request submitted: $($response.signingRequestId)"
        shell: pwsh
